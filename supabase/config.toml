# Local Supabase stack (Docker) for development: `supabase start`.
# Anything not set here uses the Supabase CLI defaults.
# Schema comes from supabase/migrations; demo data from `bun run db:seed`.

project_id = "echo-social-app"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Demo data is loaded with the bun seed scripts (seed/), not seed.sql.
enabled = false

[studio]
port = 54323

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://127.0.0.1:3000"
enable_signup = true

[auth.email]
enable_signup = true
# Local accounts work right away, without a confirmation email.
enable_confirmations = false
